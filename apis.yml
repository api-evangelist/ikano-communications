aid: ikano-communications
name: IKANO Communications
description: IKANO Communications, Inc. is a diversified consumer and business Internet company
  founded in 1999 and headquartered in metropolitan Los Angeles, with additional offices in Salt Lake
  City and Toronto, Canada. IKANO provides hosted voice services and broadband Internet access through
  direct and wholesale/private-label channels. Its primary brands include Broadvoice, a provider of
  feature-rich broadband phone (VoIP) service to consumers and businesses across the continental US and
  Canada, and DSL Extreme, a provider of high-speed and traditional Internet access. IKANO is a wholly
  owned subsidiary of Teutonic Holdings, LLC. The company publishes a marketing and corporate site only;
  it exposes no public developer program, API, or machine-readable interface at this time.
